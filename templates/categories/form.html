{% extends "base.html" %}
{% block title %}{{ "Sửa danh mục" if category else "Thêm danh mục" }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7 col-lg-6">
    <h1 class="h3 mb-3">{{ "Sửa danh mục" if category else "Thêm danh mục" }}</h1>

    <div class="card border-0 shadow-sm">
      <div class="card-body">
        <form method="post">
          <div class="mb-3">
            <label class="form-label" for="name">Tên danh mục</label>
            <input class="form-control" id="name" name="name" required maxlength="100"
                   value="{{ category.name if category else '' }}"
                   placeholder="VD: Lập trình">
          </div>
          <div class="mb-3">
            <label class="form-label" for="description">Mô tả</label>
            <textarea class="form-control" id="description" name="description" rows="3"
                      placeholder="Mô tả ngắn (tuỳ chọn)">{{ category.description if category and category.description else '' }}</textarea>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-success">
              {{ "Cập nhật" if category else "Thêm" }}
            </button>
            <a href="{{ url_for('categories_list') }}" class="btn btn-outline-secondary">Hủy</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
